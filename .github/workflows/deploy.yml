name: Deploy to GitHub Pages

# Builds the game and publishes dist/ to the gh-pages branch, which GitHub Pages serves at
# https://financeflynn5-wq.github.io/polar-penguin-fight/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # the online game server this copy of the game connects to: the repository variable GAME_SERVER_URL if set,
          # else Flynn's Hetzner box (when it doesn't answer, the menu just offers practice with bots)
          VITE_SERVER: ${{ vars.GAME_SERVER_URL || 'https://penguin.5-222-13-73.sslip.io' }}
      - name: Push dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
